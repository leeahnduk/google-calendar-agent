    type: api
    actions: [GET]
    urls: [/o/oauth2/auth]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [auth_user]
      links: [authorizationUrl]
  mail.google.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://mail.google.com/mail/u/0/#inbox/{message[id]}
      caller: [_search_gmail_attachments]
